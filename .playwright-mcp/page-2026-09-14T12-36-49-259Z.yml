            - paragraph [ref=f9e3355]: "17 лет в L&D. Проектирую и запускаю корпоративное обучение от диагностики бизнес-задачи до оценки результата. Выстроила систему развития для 490+ руководителей производственных вертикалей (Корпоративный университет РЖД, 2024-2025); NPS 9,7/10; премия «Смарт Пирамида — 2024». Сократила срок выхода новых сотрудников на эффективность на ~30% (Сбер, 2021); освоение инструментов — 85% по когортному анализу 30/60/90. Автоматизировала аналитику обратной связи через ИИ: 100+ анкет за цикл — не за 3 дня, а за 2 часа. Разработала и опубликовала открытые AI-инструменты для L&D (AOS Analyzer, Бустер методиста). Работаю в логике образовательного продукта: потребность бизнеса → архитектура → смешанное обучение → подготовка преподавателей → LMS → аналитика → улучшение. Соединяю методологию, данные и AI."
