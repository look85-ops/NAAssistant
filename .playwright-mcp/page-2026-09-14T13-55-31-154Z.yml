              - strong [ref=f49e222]:
                - generic [ref=f49e223]: "Нам нужен лидер, который сможет:"
                - generic [ref=f49e224]: создать выдающийся результат для ученика,
                - generic [ref=f49e225]: упаковать это в сильный продукт,
                - generic [ref=f49e226]: обеспечить рост продаж и маркетинговую эффективность.
            - paragraph [ref=f49e227]:
              - strong [ref=f49e228]:
                - generic [ref=f49e229]: Задача
              - generic [ref=f49e230]: "делать направление курсов одним из ключевых драйверов роста TutorOnline.ru:"
            - list [ref=f49e231]:
              - listitem [ref=f49e232]:
                - text: —
                - generic [ref=f49e233]: создать лучший продукт на рынке по качеству обучения, понятности, результатам и вовлеченности;
              - listitem [ref=f49e234]:
                - text: —
                - generic [ref=f49e235]: выстроить сильную продуктовую и маркетинговую систему;
              - listitem [ref=f49e236]:
                - text: —
                - generic [ref=f49e237]: обеспечить рост выручки, конверсий, удержания и NPS.
            - paragraph [ref=f49e238]:
              - strong [ref=f49e239]:
                - generic [ref=f49e240]: "Что нужно будет делать:"
              - generic [ref=f49e241]: 1. Развивать продукт курсов
            - list [ref=f49e242]:
              - listitem [ref=f49e243]:
                - text: —
                - generic [ref=f49e244]: Формировать стратегию направления курсов
              - listitem [ref=f49e245]:
                - text: —
                - generic [ref=f49e246]: Улучшать текущие курсы и запускать новые
              - listitem [ref=f49e247]:
                - text: —
                - generic [ref=f49e248]: Делать курсы более сильными по структуре, логике, методике и результату
              - listitem [ref=f49e249]:
                - text: —
                - generic [ref=f49e250]: Искать, где ученик теряет интерес, не понимает материал, бросает обучение — и устранять эти узкие места
              - listitem [ref=f49e251]:
                - text: —
                - generic [ref=f49e252]: Повышать ценность продукта для ученика и родителя
              - listitem [ref=f49e253]:
                - text: —
                - generic [ref=f49e254]: "Создавать сильные форматы обучения: записи, домашние задания, тренажеры, сопровождение, проверка, мотивация, диагностика прогресса"
            - paragraph [ref=f49e255]:
              - generic [ref=f49e256]: 2. Отвечать за результаты продукта
