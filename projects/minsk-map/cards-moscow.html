<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приятные поводы — Москва</title>
<style>
  :root{--paper:#f3efe5;--ink:#25221f;--muted:#665e54;--brick:#b9543d;--pine:#29483d;--ochre:#d6a33f;--white:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:#d7d0c4;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .instructions{max-width:760px;margin:24px auto;padding:20px;background:#fff;font-size:14px;line-height:1.5}.instructions h1{margin:0 0 8px;font-size:24px;letter-spacing:-.04em}.instructions p{margin:6px 0}
  .sheet{width:210mm;height:297mm;margin:14px auto;padding:8.5mm 7.5mm;display:grid;grid-template-columns:95mm 95mm;grid-template-rows:135mm 135mm;gap:5mm;background:#fff;page-break-after:always}
  .card{width:95mm;height:135mm;position:relative;overflow:hidden;padding:9mm;display:flex;flex-direction:column;border:1px solid var(--ink);background:var(--paper);break-inside:avoid}
  .front{background:var(--brick);color:#fff}.front.tone-pine{background:var(--pine)}.front.tone-ochre{background:var(--ochre);color:var(--ink)}.front.tone-paper{background:var(--paper);color:var(--ink)}
  .number{font-size:10px;letter-spacing:.14em;text-transform:uppercase}.badge{position:absolute;right:9mm;top:9mm;max-width:25mm;padding:2.5mm 2mm;border:1px solid currentColor;border-radius:999px;font-size:8px;line-height:1.1;text-align:center;text-transform:uppercase}.front h2{margin:auto 0 5mm;max-width:74mm;font-size:29px;line-height:.9;letter-spacing:-.07em;text-wrap:balance}.front .mood{font-size:11px;line-height:1.35;max-width:65mm;margin:0}.front .footer{margin-top:7mm;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
  .cover{background:var(--pine);color:#fff;justify-content:space-between}.cover h2{max-width:72mm;margin:auto 0;font-size:37px;line-height:.88;letter-spacing:-.075em}.cover .footer{font-size:9px;letter-spacing:.14em;text-transform:uppercase}
  .about{background:var(--paper)}.about h2{margin:6mm 0;font-size:28px;line-height:.9;letter-spacing:-.07em}.about p{font-size:12px;line-height:1.45;margin:0 0 5mm}.about ol{margin:0;padding-left:17px;font-size:11px;line-height:1.45}.about li{padding-left:2mm;margin-bottom:2mm}.about .qr-block{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2mm;text-align:center}.about .qr-caption{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}.about .qr{width:22mm;height:22mm;display:block;background:#fff}
  .inline-qr{display:block;width:18mm;height:18mm;margin:3mm 0 0;background:#fff}
  .blank{border-color:transparent;background:transparent}.back{background:var(--white)}.back .eyebrow{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.back h2{margin:5mm 0;font-size:21px;line-height:.95;letter-spacing:-.055em;text-wrap:balance}.back dl{margin:0;font-size:10px;line-height:1.35}.back dd{overflow-wrap:anywhere}.back dt{margin-top:3mm;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.back dd{margin:1mm 0 0}.back .soundtrack{margin-top:auto;padding:4mm;border:1px solid var(--ink);font-size:10px;line-height:1.35}.soundtrack.tone-morning,.soundtrack.tone-ochre{background:var(--ochre);color:var(--ink)}.soundtrack.tone-evening{background:var(--brick);color:#fff}.soundtrack.tone-trip,.soundtrack.tone-pine{background:var(--pine);color:#fff}.soundtrack.tone-art,.soundtrack.tone-paper{background:var(--paper);color:var(--ink)}.back .soundtrack b{display:block;margin-bottom:1mm;font-size:8px;letter-spacing:.1em;text-transform:uppercase}
  @page{size:A4 portrait;margin:0}@media print{body{background:#fff}.instructions{display:none}.sheet{margin:0}}
</style>
</head>
<body>
<section class="instructions"><h1>Приятные поводы</h1><p><b>26 карточек · 7 листов A4 на один проход · 16 листов всего</b></p><p>Печать: масштаб 100%, без подгонки. Сначала напечатай лицевые стороны, затем вставь листы обратно и напечатай обороты. Для обычного принтера выбери двустороннюю печать с переворотом по длинному краю.</p></section>
<main id="pages"></main>
<script>
const sourceCards=[
 ['Практика','театр','Большой Козихинский переулок, 30','вечер','Камерный театр, после которого хочется идти медленнее.','театр → Патриаршие пруды → поздний ужин','David Bowie — Modern Love','городская сцена и разговор после'],
 ['Внутри','театр','ул. Казакова, 8, стр. 3','вечер','Театр в десяти минутах от Курской: выбрать спектакль и остаться в атмосфере места.','театр → Казаковский переулок → кофе или бар','Portishead — Roads','камерность без церемоний'],
 ['ММОМА','искусство','ММОМА, Петровка, 25','2–3 часа','Выставка и прогулка по центру без обязательного финала.','ММОМА → Петровка → Столешников переулок → тихий двор или кафе','Khruangbin — Friday Morning','искусство и городская пауза'],
 ['МАММ и Остоженка','искусство','Мультимедиа Арт Музей, Остоженка, 16','2–3 часа','Медиакультура, фотография и маршрут по улице, где Москва умеет быть тихой.','МАММ → Остоженка → Пречистенка → Храм Христа Спасителя','The xx — Intro','смотреть на город как на монтаж'],
 ['Музей транспорта Москвы','транспорт','Гараж Мельникова, Новорязанская ул., 27','3 часа','Транспорт, конструктивизм и разговор о том, как город перемещает людей.','гараж Мельникова → экспозиция → конструктивистская прогулка','Kraftwerk — Autobahn','машины как городская память'],
 ['ЗИЛАРТ','архитектура','ЗИЛАРТ, Автозаводская, 23','2–3 часа','Музей и новый городской квартал на месте промышленной Москвы.','музей → набережная Марка Шагала → корпуса ЗИЛАРТа','Massive Attack — Teardrop','бетон, вода и новая Москва'],
 ['Сколково: город науки','технологии','Инновационный центр «Сколково»','1–3 часа','Выбрать маршрут по настроению: наука и технологии, футуристичные кадры или дубы, пруд и арт-объекты.','Сколтех → Парк наук → MatRex → Технопарк → робот-бариста','M83 — Outro','технологии без офисной скуки'],
 ['Музей Яндекса','технологии','г. Москва, ул. Тимура Фрунзе, д. 11/13','2 часа','Легендарные компьютеры, игровые приставки и вещи, изменившие повседневность.','экспонаты → история интерфейсов → магазин музея','Daft Punk — Digital Love','прошлое, которое ещё работает'],
 ['Экслибрис своими руками','искусство','Российская государственная библиотека','2–3 часа','Сделать собственный знак для книг и уйти с маленьким личным артефактом.','экскурсия → история экслибриса → мастерская','The Books — All You Need','вещь, которую можно оставить себе'],
 ['Ивановская горка','прогулка','Славянская площадь → Маросейка','3 часа','Историческая библиотека, лютеранский собор, усадьбы и переулки старой Москвы.','Славянская площадь → Покровский бульвар → Хохловский переулок → Маросейка','Leonard Cohen — Dance Me to the End of Love','город читается ногами'],
 ['Прогулки на трамвае №39','транспорт','м. Чистые пруды → м. Университет','2–3 часа','Сесть у окна и проехать Москву насквозь: Яуза, Красная площадь, Донской монастырь.','Чистые пруды → Яуза → центр → Донской монастырь → Университет','Nina Simone — Feeling Good','сидеть у окна и не спешить'],
 ['Fonoteca Listening Bar','музыка','Кривоколенный переулок, 7','вечер','Вечер, где музыка — не фон, а главный собеседник.','бар → пластинка → один выбранный трек на двоих','Sade — By Your Side','слушать внимательнее'],
 ['Хлебозавод','архитектура','ул. Новодмитровская, д. 1','2–3 часа','Памятник конструктивизма и обед там, где промышленная история стала городской сценой.','Хлебозавод → конструктивистские корпуса → обед','Talking Heads — This Must Be the Place','форма следует за функцией'],
 ['Московский ипподром','спорт','Центральный Московский ипподром, Беговая, 22','2–3 часа','Старые трибуны, лошади и городская скорость без пробок.','ипподром → трибуны → Беговая → кофе','Tom Waits — Hold On','городская механика и немного риска'],
 ['Кусково','усадьба','ул. Юности, 2','3–5 часов','Дворец, парк, павильоны и возможность выбрать выставку, концерт или просто длинную прогулку.','дворец → Итальянский домик → Грот → парк → павильоны','Vashti Bunyan — Diamond Day','дворянская пауза в городе'],
 ['Покровское-Стрешнево','парк','парк Покровское-Стрешнево','3–4 часа','Лес, пруды и прогулка, в которой Москва постепенно растворяется.','усадьба → пруды → лесные дорожки → чай','Nick Drake — Northern Sky','воздух вместо расписания'],
 ['Переделкино','литература','Библиотека в Доме творчества, Переделкино','3–4 часа','Зависнуть в библиотеке, пройтись по писательскому посёлку и не торопиться обратно.','Библиотека → писательские дома → дачный маршрут','José González — Heartbeats','читать город между строк'],
 ['Арт-усадьба Веретьево','искусство','Талдомский район, дер. Веретьево; 56.696625, 37.274229','целый день','Парк Александра Бродского: деревянные скульптуры, лес, беседки и пикник.','лесные скульптуры → поляна → беседки → пикник','Fleetwood Mac — Dreams','архитектура, которую можно потрогать взглядом'],
 ['Истра: искусство и сыр','выезд','Музейный комплекс Новый Иерусалим → Сыроварня Олега Сироты','целый день','Музей, дорога и сыр как честный финал большого дня.','Музейный комплекс Новый Иерусалим → прогулка по Истре → сыроварня','Beirut — Nantes','выезд, который стоит километров'],
 ['Серпухов','выезд','Серпуховский историко-художественный музей','целый день','Музей, старый город и ощущение, что Москва закончилась мягко, а не резко.','музей → посад → Соборная гора → чай','The Beatles — Here Comes the Sun','малый город с большим воздухом'],
 ['Старица на выходные','выезд','Старица, Тверская область','2 дня','Монастырь, Волга, пещеры, купеческий город и Берново с пушкинским маршрутом.','Свято-Успенский монастырь → Волга → пещеры → Берново','Bon Iver — Holocene','длинный разговор и другая скорость'],
 ['Палеонтологический музей','наука','ул. Профсоюзная, 123','3 часа','Доисторические скелеты, масштаб времени и прогулка после музея.','залы музея → динозавры → Тропарёво','Ólafur Arnalds — Near Light','когда один день становится миллионами лет'],
 ['Дубровицы → Александрово-Щапово → Поливаново','усадьбы','Московская область','целый день','Три усадьбы за один выезд: церковь, парк, вода и дорога между ними.','Дубровицы → Александрово-Щапово → Поливаново','Vangelis — La Mort du Loup','архитектура и дорога без суеты'],
 ['Масловка и городок художников','искусство','ул. Верхняя Масловка, 3','2–3 часа','Музей Масловки и прогулка по городку художников — место, где быт и искусство живут рядом.','музей → мастерские → городок художников → кофе','Erik Satie — Gymnopédie No. 1','тихая московская богема'],
 ['Иван-чайное купе','еда','Садовническая улица, 80','2–3 часа','Кафе в атмосфере железнодорожного путешествия: иван-чай, исторические сладости и разговор.','чайное купе → пастила → чайная полка → прогулка по Садовнической','Django Reinhardt — Minor Swing','перестук колёс без поезда'],
 ['Звенигород и Музей русского десерта','выезд','Звенигород','целый день','Старинный город, музей сладостей и повод ехать за пределы Москвы без большого плана.','Вал Звенигородского Кремля → музей → прогулка → чай и десерт','Antônio Carlos Jobim — Águas de Março','сладкий финал дороги']
];
const cards=[0,2,6,10,14,8,18,9,11,21,5,16,13,3,15,19,12,24,1,22,7,17,20,4,23,25].map(index=>sourceCards[index]);
const pages=document.getElementById('pages');
const t=text=>String(text).replace(/\s(в|во|и|а|но|к|ко|с|со|у|о|об|от|до|из|на|по|за|для|без|над|под|при|про)\s/gi,' $1&nbsp;');
const coverFront=document.createElement('section');coverFront.className='sheet';coverFront.appendChild(coverCard());[0,1,2].forEach(()=>coverFront.appendChild(blankCard()));pages.appendChild(coverFront);
const coverBack=document.createElement('section');coverBack.className='sheet';coverBack.appendChild(blankCard());coverBack.appendChild(aboutCard());[0,1].forEach(()=>coverBack.appendChild(blankCard()));pages.appendChild(coverBack);
function coverCard(){const el=document.createElement('article');el.className='card cover';el.innerHTML='<span class="number">Колода прогулок · Москва</span><h2>Приятные<br>поводы</h2><span class="footer">для Глеба и Кати</span>';return el}
function aboutCard(){const el=document.createElement('article');el.className='card back about';el.innerHTML='<span class="eyebrow">как пользоваться колодой</span><h2>Двадцать шесть<br>приятных поводов</h2><p>Москва и вокруг: театры, технологии, прогулки, музеи, кафе и выезды.</p><ol><li>Вытяните одну карточку.</li><li>Выберите день и темп.</li><li>Отправляйтесь вдвоём.</li><li>После прогулки положите карточку отдельно.</li></ol><div class="qr-block"><p class="qr-caption">Саундтрек ко всей колоде</p><img class="qr" src="qr-playlist.png" alt="QR-код плейлиста саундтрека к колоде"></div>';return el}
function blankCard(){const el=document.createElement('article');el.className='card blank';return el}
function toneFor(category){if(category==='театр'||category==='музыка')return 'tone-evening';if(category==='выезд'||category==='усадьба'||category==='парк')return 'tone-pine';if(category==='технологии'||category==='транспорт'||category==='спорт')return 'tone-ochre';if(category==='искусство'||category==='архитектура'||category==='литература'||category==='еда')return 'tone-paper';return 'tone-morning'}
for(let start=0;start<cards.length;start+=4){const front=document.createElement('section');front.className='sheet';cards.slice(start,start+4).forEach((card,index)=>front.appendChild(frontCard(card,start+index+1)));pages.appendChild(front);const back=document.createElement('section');back.className='sheet';[1,0,3,2].forEach(index=>{if(cards[start+index])back.appendChild(backCard(cards[start+index],start+index+1))});pages.appendChild(back)}
function frontCard(card,n){const el=document.createElement('article');el.className=`card front ${toneFor(card[1])}`;el.innerHTML=`<span class="number">${String(n).padStart(2,'0')} / ${t(card[1])}</span><span class="badge">${t(card[3])}</span><h2>${t(card[0])}</h2><p class="mood">${t(card[4])}</p><span class="footer">Приятные поводы</span>`;return el}
function backCard(card,n){const el=document.createElement('article');el.className=`card back ${toneFor(card[1])}`;const qr=card[0]==='Сколково: город науки'?'<img class="inline-qr" src="moscow-skolkovo-qr.svg" alt="QR-код маршрутов Сколково">':card[0]==='Экслибрис своими руками'?'<img class="inline-qr" src="moscow-exlibris-qr.svg" alt="QR-код маршрута экслибриса РГБ">':card[0]==='Хлебозавод'?'<img class="inline-qr" src="moscow-hlebozavod-qr.svg" alt="QR-код аудиогида по Хлебозаводу">':'';el.innerHTML=`<span class="eyebrow">карточка ${String(n).padStart(2,'0')} · ${t(card[1])}</span><h2>${t(card[0])}</h2><dl><dt>Куда</dt><dd>${t(card[2])}</dd><dt>Остановки</dt><dd>${t(card[5])}</dd><dt>Ритм дня</dt><dd>${t(card[3])}</dd></dl>${qr}<p class="soundtrack ${toneFor(card[1])}"><b>Саундтрек</b>${t(card[6])}<br><span>${t(card[7])}</span></p>`;return el}
</script>
</body>
</html>
