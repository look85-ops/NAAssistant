<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наш Минск — минимализм</title>
<style>
  :root{
    --bg:#f6f6f4;
    --ink:#1a1a1a;
    --muted:#8a8a85;
    --line:#e3e3df;
    --accent:#1e5c3f;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* hero */
  header{padding:96px 0 56px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
  h1{font-size:clamp(40px,8vw,84px);letter-spacing:-.04em;line-height:1.02;font-weight:600;max-width:12ch}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{margin-top:28px;font-size:17px;color:var(--muted);max-width:46ch}

  /* progress */
  .progress{margin-top:56px;border-top:1px solid var(--line);padding-top:24px}
  .progress .row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .num{font-size:clamp(48px,7vw,72px);font-weight:600;letter-spacing:-.03em;line-height:1}
  .num small{font-size:18px;color:var(--muted);font-weight:400;letter-spacing:0}
  .bar{margin-top:16px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:8%;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.16,1,.3,1)}

  /* list */
  main{padding:16px 0 120px}
  .place{border-top:1px solid var(--line)}
  .place:last-child{border-bottom:1px solid var(--line)}
  .place button{width:100%;display:flex;align-items:center;gap:24px;padding:28px 4px;background:none;border:none;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .place .idx{font-size:13px;color:var(--muted);width:28px;flex:none}
  .place .name{font-size:24px;font-weight:500;letter-spacing:-.01em;flex:1}
  .place .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .place .area{font-size:13px;color:var(--muted);width:140px;text-align:right;flex:none;display:none}
  @media(min-width:720px){.place .area{display:block}}
  .dot{width:26px;height:26px;border:1.5px solid var(--line);border-radius:50%;flex:none;display:grid;place-items:center;transition:all .25s ease}
  .place.done .dot{background:var(--accent);border-color:var(--accent)}
  .place.done .dot::after{content:"";width:11px;height:6px;border:2px solid #fff;border-top:none;border-right:none;transform:rotate(-45deg) translateY(-1px)}
  .place.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

  .hint{margin-top:48px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="kicker">Наш год в Минске</div>
    <h1>24 места, куда мы <em>пойдём вместе</em></h1>
    <p class="sub">Два похода в месяц. Отмечаем, что уже видели, и смотрим, как город становится нашим.</p>

    <div class="progress">
      <div class="row">
        <span class="num" id="count">2 <small>из 24</small></span>
        <span class="num" id="pct" style="font-size:18px;color:var(--muted);font-weight:400">8% года прожито</span>
      </div>
      <div class="bar"><i id="fill"></i></div>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="list"></div>
  <div class="wrap"><p class="hint">Это черновик — 6 мест для примера. В финале будет 24, с картой и фото.</p></div>
</main>

<script>
  const PLACES = [
    {name:"Национальный художественный музей", tag:"Музей", area:"Центр"},
    {name:"Большой театр оперы и балета", tag:"Театр", area:"Центр"},
    {name:"Верхний город", tag:"Прогулка", area:"Центр"},
    {name:"Октябрьская улица", tag:"Галереи и стрит-арт", area:"Центр"},
    {name:"Васильки", tag:"Белорусская кухня", area:"Центр"},
    {name:"Несвижский замок", tag:"Пригород", area:"2 часа езды"}
  ];
  const KEY = "minsk-minimal-done";
  const done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));

  const list = document.getElementById("list");
  PLACES.forEach((p,i)=>{
    const el = document.createElement("div");
    el.className = "place" + (done.has(i) ? " done" : "");
    el.innerHTML = `
      <button>
        <span class="idx">${String(i+1).padStart(2,"0")}</span>
        <span class="name">${p.name}</span>
        <span class="tag">${p.tag}</span>
        <span class="area">${p.area}</span>
        <span class="dot"></span>
      </button>`;
    el.querySelector("button").addEventListener("click",()=>{
      done.has(i) ? done.delete(i) : done.add(i);
      localStorage.setItem(KEY, JSON.stringify([...done]));
      render();
    });
    list.appendChild(el);
  });

  function render(){
    const total = PLACES.length;
    const n = done.size;
    document.getElementById("count").innerHTML = n + " <small>из " + total + "</small>";
    document.getElementById("pct").textContent = Math.round(n/total*100) + "% года прожито";
    document.getElementById("fill").style.width = (n/total*100) + "%";
    [...list.children].forEach((c,i)=>c.classList.toggle("done", done.has(i)));
  }
  render();
</script>
</body>
</html>
