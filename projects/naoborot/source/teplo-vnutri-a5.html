<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тепло внутри — открытки Наоборот</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');
  :root{--wine:#6b2430;--ivory:#faf6ef;--ink:#28221c;--gold:#b98a3f;--line:#ded4c7;--muted:#766c60}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d8;color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .instructions{max-width:850px;margin:24px auto;padding:20px 24px;background:#fff}.instructions h1{margin:0 0 8px;font:400 27px/1.1 Fraunces,Georgia,serif}.instructions p{margin:6px 0;color:#5d554a}
  /* 3 mm bleed on every side; trim is 210 x 148 mm inside the page. */
  .sheet{width:216mm;height:154mm;margin:14px auto;padding:0;display:block;background:#fff;page-break-after:always}
  .postcard{width:216mm;height:154mm;overflow:hidden;position:relative;break-inside:avoid}
  .front{padding:13mm 15mm;display:flex;flex-direction:column;justify-content:flex-end;background:var(--wine);color:var(--ivory);border-radius:2px}
  .front h2{max-width:110mm;margin:0;font:400 38px/1.03 Fraunces,Georgia,serif;letter-spacing:-.015em;text-wrap:balance}
  .back{padding:11mm 12mm;background:var(--ivory);border:1px solid var(--line);display:flex;gap:8mm;align-items:flex-start}
  .sparkle{flex:0 0 18mm;color:var(--wine);margin-top:2mm}
  .copy{min-width:0;height:100%;display:flex;flex-direction:column}
  .copy h3{margin:0 0 5mm;font:400 25px/1.05 Fraunces,Georgia,serif;color:var(--wine)}
  .text{font-size:14px;line-height:1.45;color:#5d554a;overflow:hidden;text-wrap:pretty}
  .text p{margin:0 0 3mm}.text p:last-child{margin-bottom:0}.text ul{margin:0 0 3mm;padding-left:5mm}.text li{padding-left:1mm;margin-bottom:1.5mm}.text b{font-weight:500;color:var(--ink)}
  .recommendations{display:block;width:216mm;height:154mm;margin:0;padding:20mm 25mm;background:var(--ivory);border:1px solid var(--line)}
  .recommendations h2{margin:0 0 3mm;font:400 30px/1.05 Fraunces,Georgia,serif;color:var(--wine)}
  .recommendations .intro{max-width:165mm;margin:0 0 5mm;color:#5d554a;font-size:12px}
  .book-list{display:grid;grid-template-columns:repeat(3,1fr);column-gap:12mm;row-gap:2mm;margin:0;padding:0;list-style:none}
  .book-list li{font-size:10px;line-height:1.2}.book-list strong{font-weight:500;color:var(--wine)}
  .book-list span{display:block;color:var(--muted);font-size:9px}
  .note{margin-top:5mm;padding-top:4mm;border-top:1px solid var(--line);font-size:10px;color:#5d554a;max-width:165mm}
  @page{size:216mm 154mm;margin:0}
  @media print{body{background:#fff}.instructions{display:none}.sheet{margin:0}}
  @media(max-width:760px){.sheet{width:100%;height:auto;margin:0;padding:16px;display:block}.postcard,.recommendations{width:100%;height:auto;min-height:280px;margin-bottom:16px}.book-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="instructions">
  <h1>Тепло внутри</h1>
  <p><b>12 горизонтальных открыток · формат A5 · 210 × 148 мм</b></p>
  <p>Каждая сторона — отдельная страница PDF. Для двусторонней печати выбирайте масштаб 100% и переворот по короткому краю.</p>
</section>
<main id="pages"></main>
<script>
const sparkle='<svg class="sparkle" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"><path d="M32 5v54M5 32h54M13 13l38 38M51 13 13 51"/><path d="M32 15l3 14 14 3-14 3-3 14-3-14-14-3 14-3 3-14Z"/><path d="M9 8v10M4 13h10M55 46v10M50 51h10"/></svg>';
const cards=[
  ['Варенье','Есть особое удовольствие — достать банку летнего варенья.\n\nОткрываешь — и на секунду возвращается июль: горячий полдень, липкие от сока пальцы, дачная кухня на улице.\n\nПотом появляется запах. Не громкий, а чуть слышимый, как воспоминание, которое\nи не ждало повода.\n\nЛожка входит в тёмную густоту медленно, напоминая, что всё было по-настоящему,\nи обещая, что точно будет ещё.','Игорь Северянин — «Рябиновая поэза»'],
  ['В глубине памяти','У каждого внутреннего моря есть свои глубинные слои.\n\nНа поверхности — сегодняшние заботы. Чуть ниже — планы на завтра.\n\nНо если погрузиться дальше, туда, где почти нет движения, можно найти то,\nчто мы не доставали годами: ощущения, почти забытые мелодии, запахи, сцену из фильма.\n\nВсё это лежит на дне и не требует подъёма. Ему не нужно быть проанализированным,\nисправленным или даже понятым. Достаточно просто знать: там, в глубинах памяти,\nживёт то, что сделало нас нами.\n\nЗакройте глаза и попробуйте вытянуть из глубины одно забытое ощущение.','Сергей Рахманинов — Прелюдия соль минор, соч. 23 №5'],
  ['Встречи в пути','И в наших ежедневных одиссеях есть остановки, которых не было в плане. Не циклопы и не бури, а события или голоса вокруг нас, которые меняют курс, а может возвращают нас на дорогу уже другими.\n\nИногда это голос-предупреждение, как у Цирцеи: «Не ходи туда, там ты потеряешь время». И мы обходим стороной целый квартал или отменяем встречу, которую так долго ждали.\n\nИногда — голос Калипсо, который задерживает нас. А бывают события-наваждения, как встречи с Сиренами. И нам предстоит решать, довериться\nим или отстраниться.\n\nВспомните одну случайную встречу или фразу, которая когда-то изменила ваш путь.','Penguin Cafe Orchestra — «Perpetuum Mobile»'],
  ['Своя сцена','Настоящий праздник не требует приглашений. Иногда он разворачивается на подоконнике, на скамейке в соседнем дворе или за кухонным столом,\nпока чайник закипает.\n\nМожно объявить утро торжественным открытием: выйти на балкон с первой чашкой кофе и считать это главной сценой. В обед устроить камерный концерт из любимых произведений.\n\nВечером объявить закрытие: старый фильм или просто долгая прогулка, где в конце вы сами себе аплодируете за то, что провели этот день по своим правилам.\n\nЛюбой день — идеальное время для самочинного праздника. Только\nсвоя афиша,\nсвои удовольствия, свой ритм.\nЧто бы\nвы поставили в программу первым пунктом?','Рэй Брэдбери — «Вино из одуванчиков»'],
 ['Всякое','На кухне, в коридоре, в ванной всегда найдётся этот ящик. Туда складывается то, что не выбрасывается, но и не находит места.\n\nБатарейки.\nШнур от чего-то.\nКлюч непонятно от чего.\nИнструкция к утюгу.\n\nЭтот ящик — биография быта. В нём оседает всё, что было нужно когда-то и может пригодиться когда-нибудь.\n\nЕсли изучить его внимательно, можно вспомнить, какие лекарства мы покупали зимой, из каких мест мы привозили ручки, чьи визитки храним.\n\nНайдите свой ящик со «всяким» и просто посмотрите, что там живёт.','Steve Reich — «Music for 18 Musicians»'],
  ['Из чего состоит весна','Весна приходит незаметно, но уверенно. Не спрашивает, не стучится. Просто становится частью комнаты, запахом мокрой листвы, светом, который не спешит уходить.\n\nИз чего же состоит весна:\n• открытых окон\n• ощущения по-настоящему тёплого ветра на лице\n• жёлтой пыльцы на подоконнике\n• бесконечных закатов\n• первой грозы\n• метели из лепестков яблонь\n• момента, когда перестаёшь вечерами зажигать свет\n• тяжёлых прохладных гроздьев сирени, в которые хочется зарываться лицом\n\nМысленно составьте список своих майских примет.','Михаил Зенкевич — «В мае»'],
  ['Поднимите голову','Небо — самый большой экран, на который не часто смотрят просто так.\nНад нами целый мир: плывут облака, птица выбирает направление, след самолёта тает, не дождавшись зрителей.\nВсё это происходит прямо сейчас.\n\nВыйдя на улицу, остановитесь на минуту и поднимите взгляд выше крыш.\nЧто там?\nНе ищите ничего конкретного.\nПросто смотрите.\n\nНаверху всё живёт в другом ритме, попробуйте почувствовать его.','Антуан де Сент-Экзюпери — «Планета людей»'],
  ['Ода монохромности','Зимний свет приглушён, как акварель, размытая водой. Вместо ярких красок\nон предлагает нам сотни припылённых оттенков.\nВ такую пору мы ищем тепло в окружающих нас фактурах, памяти предметов и собственных ощущениях.\n\nВыберите в своём окружении предмет самого «тихого», сдержанного оттенка. Рассмотрите его. Закройте глаза и попробуйте удержать этот цвет в памяти.\n\nВозвращайтесь к нему взглядом или мысленно, чтобы замедлиться.','«Небо над Берлином»'],
  ['Три дара','Чудесам не нужно просить разрешения. Когда ёлка уже убрана, а коробки с игрушками отправились обратно на антресоли, моменты волшебства не заканчиваются.\nВ эти минуты можно начать творить их самим.\n\nВремя — подарите кому-то 10 минут вашего безраздельного внимания.\n\nСлово — напишите короткое послание себе или другому и спрячьте в карман или сумку, как будущую «случайную находку».\n\nЖест — совершите один простой бескорыстный жест: уступка, улыбка, помощь.','Agnes Obel — Familiar'],
  ['На кончиках пальцев','Иногда день возвращается не мыслью, а прикосновением.\nТёплая чашка, которую держишь обеими руками.\nШероховатость деревянного стола под ладонью.\nКрай рукава, который скользит по запястью.\nВолосы у виска, отведённые рукой.\nКожа, почувствовавшая воздух из открытого окна — прохладный, чуть влажный, с запахом мокрой листвы.\nТело помнит то, чего не успела запомнить голова.\nВсё это остаётся на подушечках пальцев — тихо, без слов, как след от прикосновения, который держится дольше, чем кажется.','Дэвид Линден — «Осязание»'],
  ['Ничего','Есть дни, в которых ничего не происходит.\nИ, может быть, именно поэтому в них наконец появляется место для себя.\nСолнечный квадрат медленно ползёт по полу.\nТело становится тяжёлым, а мысли — лёгкими.\nМинута растягивается на полчаса, час пролетает как вздох.\nЛень разрешает отпустить все заботы и быть частью медленного дня.\nНе читать, не отвечать, не успевать.\nИ тогда «ничего» становится главным событием дня.','Бертран Рассел — «Похвала праздности»'],
  ['Долгие вечера','На столе остывает чай.\nРядом лежит книга, раскрытая на одной и той же странице.\nВ колонке звучит музыка — тихая, почти случайная.\nМожно говорить.\nМожно молчать.\nМожно перечитать одну страницу и обнаружить, что прошло двадцать минут.\nТакие вечера не требуют, чтобы их чем-то заполнили.','Tara Clerkin Trio — «In Spring»']
];
const pages=document.getElementById('pages');
 const typographic=s=>String(s).replace(/(^|\s)(в|во|и|а|но|к|ко|с|со|у|о|об|от|до|из|на|по|за|для|без|над|под|при|про|не|что|как|же|ли|бы)\s+/gim,'$1$2\u00A0').replace(/\s+(в|во|и|а|но|к|ко|с|со|у|о|об|от|до|из|на|по|за|для|без|над|под|при|про|не|что|как|же|ли|бы)\s+/gi,' $1\u00A0');
const notes={
 'Варенье':'поэзия о вкусе как короткой дороге обратно в лето.',
 'В глубине памяти':'музыка для тихого погружения в собственные воспоминания.',
 'Встречи в пути':'саундтрек для дороги, случайностей и смены курса.',
 'Своя сцена':'книга о личном празднике и удовольствии жить по своим правилам.',
 'Всякое':'минималистичная музыка для внимательного взгляда на обычные вещи.',
 'Из чего состоит весна':'текст о сезоне, который собирается из запахов, света и примет.',
 'Поднимите голову':'книга о дороге, небе и способности видеть больше привычного.',
 'Ода монохромности':'фильм-пауза о тишине, цвете и внутреннем взгляде.',
 'Три дара':'музыка о близости, знакомой и немного странной одновременно.',
 'На кончиках пальцев':'книга о том, как прикосновение возвращает нас в тело.',
 'Ничего':'эссе в защиту свободного времени и жизни без постоянной пользы.',
 'Долгие вечера':'музыка для комнаты, где вечер не нужно ничем заполнять.'
};
function face(c){return `<article class="postcard front"><h2>${typographic(c[0])}</h2></article>`}
 function back(c){const blocks=c[1].split(/\n\n+/).map(x=>{const lines=x.split('\n');const bulletStart=lines.findIndex(line=>line.trim().startsWith('•'));if(bulletStart>-1){const lead=lines.slice(0,bulletStart).filter(Boolean);const bullets=lines.slice(bulletStart).filter(line=>line.trim().startsWith('•'));return `${lead.length?`<p>${lead.map(typographic).join('<br>')}</p>`:''}<ul>${bullets.map(line=>`<li>${typographic(line.replace(/^\s*•\s*/,''))}</li>`).join('')}</ul>`}return `<p>${lines.map(typographic).join('<br>')}</p>`}).join('');return `<article class="postcard back">${sparkle}<div class="copy"><h3>${typographic(c[0])}</h3><div class="text">${blocks}</div></div></article>`}
 function sheet(item,side){return `<section class="sheet">${side==='face'?face(item):back(item)}</section>`}
 cards.forEach(c=>{pages.insertAdjacentHTML('beforeend',sheet(c,'face'));pages.insertAdjacentHTML('beforeend',sheet(c,'back'))})
</script>
</body>
</html>
