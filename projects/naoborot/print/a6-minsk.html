<style>

:root{--wine:#641f2c;--deep:#42131d;--acid:#d9e85c;--paper:#f4f0e8;--white:#fffdf8;--ink:#211b18;--muted:#6f655c;--display:"DM Sans",Arial,sans-serif;--sans:Manrope,Arial,sans-serif;

.rec b{display:block;font-size:5.8pt;letter-spacing:.1em;text-transform:uppercase;margin-bottom:0.6mm}

@page{size:var(--pw) var(--ph);margin:0}
@media print{html,body{background:#fff}.page{margin:0}}
</style></head><body><main id="pages"></main>
<script>
const DATA = [["От нового дома к библиотеке", "рядом с домом", "Логойский тракт, 37, корпус 2 → Национальная библиотека", "3–4 часа", "Выйти из нового дома и дойти до самого популярного здания в Минске.", "Логойский тракт → Полоцкий парк → скульптура Сыщик → библиотека", "The Cinematic Orchestra — To Build a Home", "медленно и с предвкушением"], ["Завтрак с видом", "утро", "Grand Cafe → Верхний город → набережная Свислочи", "3 часа", "Начать с завтрака на Ленина, пройти через Верхний город и закончить у воды.", "ул. Ленина, 2 → площадь Свободы → ул. Герцена → Троицкое предместье → Комсомольское озеро", "Khruangbin — Friday Morning", "мягкое утро без обязательных дел"], ["После театра", "вечер", "Новый драматический театр → Осмоловка → Mon Nom", "3–4 часа", "Спектакль, тихие улицы и десерт, который можно обсуждать вместе с постановкой.", "ул. Лизы Чайкиной, 16 → ул. Кисёлева → ул. Богдановича → ул. Клумова, 11", "Chet Baker — I Fall in Love Too Easily", "город уже звучит тише"], ["Искусство и Октябрьская", "город", "Галерея «Ў» → Октябрьская улица", "2–3 часа", "Начать с выставки и пройти улицу, где бывшая промышленная архитектура стала городской сценой.", "ул. Октябрьская, 19 → ул. Октябрьская, 23 → ул. Октябрьская, 16 → ул. Ленина", "David Bowie — Modern Love", "чуть смелее обычного"], ["Прогулка у воды", "рядом с домом", "Логойский тракт, 37, корпус 2 → Цнянское водохранилище", "3–5 часов", "Идти без цели, свернуть к воде и оставить финал открытым.", "Lake Side Park → берег Цны → лесные дорожки у водохранилища", "Nick Drake — Northern Sky", "воздух, вода и длинная дорога"], ["День за городом: Прилуки", "поездка", "Усадьба Чапского в Прилуках", "4–5 часов", "Дворец, парк и дорога, которую приятно обсуждать по пути.", "усадьба Чапского → дворцовый парк → берег Свислочи → деревенская улица Прилук", "Vashti Bunyan — Diamond Day", "маленькое путешествие"], ["День за городом: Станьково", "поездка", "Дворцово-парковый комплекс в Станьково", "4–5 часов", "Пряничный дворец Белорусский театр кукол → Герцена", "3 часа", "Спектакль, который начинается с кукольной сцены, а заканчивается разговором о взрослых вещах.", "ул. Энгельса, 20 → ул. Интернациональная → ул. Герцена → Верхний город", "Tom Waits — Hold On", "немного странности к месту"], ["Осмоловка без спешки", "прогулка", "Осмоловка → тихие дворы → кофейня", "2–3 часа", "Рассматривать дома, выбирать окна и искать место для возвращения.", "ул. Богдановича → ул. Кисёлева → ул. Коммунистическая → ул. Старовиленская", "José González — Heartbeats", "идти рядом и молчать"], ["Зыбицкая → Герцена", "вечер", "Зыбицкая → улица Герцена", "2–3 часа", "За один вечер увидеть шумный и тихий Минск: бары, монастырская стена, купеческие дома.", "ул. Зыбицкая → ул. Интернациональная → ул. Герцена → монастырская стена", "Portishead — Roads", "два разных города за один вечер"], ["Верхний город и Раковское предместье", "прогулка", "площадь Свободы → набережная Свислочи", "2–3 часа", "Верхний город и Раковское предместье — совсем рядом: дворики, старые фасады, купеческие дома и выход к воде.", "площадь Свободы → ул. Кирилла и Мефодия → ул. Витебская → ул. Раковская → набережная Свислочи", "Leonard Cohen — Dance Me to the End of Love", "старый город и длинный разговор"], ["Красный дворик", "город", "Красный дворик → Революционная улица", "2 часа", "Начать с арки и закончить прогулкой по центру, где город меняет масштаб.", "ул. Революционная, 7/11 → ул. Комсомольская → ул. Интернациональная → проспект Независимости", "La Femme — Où va le monde", "короткий маршрут с характером"], ["Ресторан The View", "ужин", "Royal Plaza, 28 этаж · пр-т Победителей, 7а", "2–3 часа", "Fine cuisine на 28 этаже небоскрёба: панорама на Свислочь и Троицкое предместье, вечером — подсветка исторических кварталов.", "Royal Plaza → 28 этаж → панорамные окна → вечерняя набережная", "John Coltrane — In a Sentimental Mood", "город внизу и хороший ужин"], ["Посиделки в «Чайной почте»", "чай", "пл. Победы: пр. Независимости, 44-3Н", "ежедневно · 12:00–22:00", "Выбрать новый сорт, познакомиться с чайными традициями и согреться в уютной атмосфере вместо привычного кофе на вынос.", "«Чайная почта» → чайная полка → разговор за столом", "Sade — By Your Side", "замедлиться и согреться"], ["Смотровая площадка гостиницы «Беларусь»", "вид", "ул. Сторожовская, 15", "ежедневно · 10:00–23:00", "Посмотреть на вечерний Минск с высоты 22-го этажа, когда город уже зажёг огни. Последний подъём в 22:30.", "вход в гостиницу → 22-й этаж → вечерний город", "M83 — Outro", "город внизу становится тише"], ["Квартал Минска, о котором мало кто знает", "исследование", "ул. Маневича, 1", "2–3 часа", "Найти квартал, который легко пропустить, и рассмотреть его без заранее заданного маршрута.", "ул. Маневича, 1 → квартал → ближайшая тихая улица", "Beirut — Nantes", "маленькое открытие внутри города"], ["Экотропа «Погребищенские родники»", "природа", "54.257727, 28.015182", "3–4 часа", "Пройти экотропу длиной 1,2 км и выбраться из городского ритма к родникам.", "начало экотропы → родники → лесная дорожка → выход", "Bon Iver — Holocene", "лес, вода и короткая дорога"], ["Комок", "винтаж", "ул. Николая Дрозда, 25А, корп. 4", "2–3 часа", "Зайти в самый большой магазин Беларуси с предметами искусства, антикварной и дизайнерской мебелью, фарфором, книгами и виниловыми пластинками.", "ангар 600 кв. м → искусство → книги и фарфор → виниловые пластинки", "Antônio Carlos Jobim — Águas de Março", "вещи с историей и время для рассматривания"], ["Фермерский рынок «ЎсёСваё»", "рынок", "адрес уточнить у @usesvae_belarus", "суббота · 9:00–15:00", "Закупиться продуктами местных хозяйств: крафтовые сыры, хлеб на закваске, колбасы и рыба из белорусских озёр.", "рыночные ряды → крафтовые сыры → хлеб на закваске → рыба и колбасы", "Simon & Garfunkel — The 59th Street Bridge Song", "суббота, рынок и приятная суета"]];
const KIND = "route";
const TW = 105, TH = 148;
const re = /\s+(в|во|и|а|но|к|ко|с|со|у|о|об|от|до|из|на|по|за|для|без|над|под|при|про|не|что|как|же)\s+/gi;
const t = s => String(s == null ? '' : s).replace(re, ' $1\u00A0');
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const pages = document.getElementById('pages');
function marks(){
  const m = el('div','marks');
  const pos = [[8,8,'h'],[8,8,'v'],[8+TW,8,'h'],[8+TW,8,'v'],[8,8+TH,'h'],[8,8+TH,'v'],[8+TW,8+TH,'h'],[8+TW,8+TH,'v']];
  pos.forEach(([x,y,dir])=>{
    const line = el('div','mark');
    if(dir==='h'){ line.style.cssText += `left:${x-4}mm;top:${y}mm;width:4mm;height:0.2mm`; }
    else { line.style.cssText += `left:${x}mm;top:${y-4}mm;width:0.2mm;height:4mm`; }
    m.appendChild(line);
  });
  return m;
}
DATA.forEach((c) => {
  const front = el('section','page front');
  const trimF = el('div','trim');
  const safeF = el('div','safe');
  if (KIND === 'state') {
    safeF.appendChild(el('div','cat','зима · открытка'));
    safeF.appendChild(el('h1', null, t(c[0])));
    safeF.appendChild(el('p','mood', ''));
  } else {
    safeF.appendChild(el('div','cat', t(c[1])));
    safeF.appendChild(el('h1', null, t(c[0])));
    safeF.appendChild(el('p','mood', t(c[7])));
  }
  trimF.appendChild(safeF); front.appendChild(trimF); front.appendChild(marks()); pages.appendChild(front);

  const back = el('section','page back');
  const trimB = el('div','trim');
  const safeB = el('div','safe');
  safeB.appendChild(el('div','sparkle','✦'));
  safeB.appendChild(el('h2', null, t(c[0])));
  if (KIND === 'state') {
    const body = el('div','body');
    String(c[1]).split(/\n+/).filter(Boolean).forEach(p => body.appendChild(el('p', null, t(p))));
    safeB.appendChild(body);
    safeB.appendChild(el('div','rec', `<b>Рекомендация</b>${t(c[2])}`));
  } else {
    const meta = el('dl','meta');
    const rows = [['Куда', c[2]], ['Остановки', c[5]], ['Ритм', c[3]]];
    rows.forEach(([k,v]) => { if(v){ meta.appendChild(el('dt', null, k)); meta.appendChild(el('dd', null, t(v))); } });
    safeB.appendChild(meta);
    safeB.appendChild(el('div','rec', `<b>Саундтрек</b>${t(c[6])}`));
  }
  trimB.appendChild(safeB); back.appendChild(trimB); back.appendChild(marks()); pages.appendChild(back);
});
</script></body></html>
