<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Тепло внутри — A6</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap');
:root{--wine:#641f2c;--deep:#42131d;--acid:#d9e85c;--paper:#f4f0e8;--white:#fffdf8;--ink:#211b18;--muted:#6f655c;--display:"DM Sans",Arial,sans-serif;--sans:Manrope,Arial,sans-serif;
--pw:164mm;--ph:121mm;--tw:148mm;--th:105mm;--sw:138mm;--sh:95mm}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:#ddd;font-family:var(--sans);color:var(--ink)}
.page{position:relative;width:var(--pw);height:var(--ph);background:#fff;page-break-after:always;overflow:hidden;margin:0 auto}
.page:last-child{page-break-after:auto}
.trim{position:absolute;left:8mm;top:8mm;width:var(--tw);height:var(--th);overflow:hidden}
.front .trim{background:var(--wine);color:var(--paper)}
.back .trim{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 0.2mm rgba(33,27,24,.12)}
.safe{position:absolute;left:13mm;top:13mm;width:var(--sw);height:var(--sh);display:flex;flex-direction:column}
.front .safe{justify-content:flex-end}
.cat{font-size:6.5pt;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:auto}
h1{margin:0 0 2mm;font:600 17pt/.98 var(--display);letter-spacing:-.03em;text-wrap:balance;max-width:100%}
.mood{font-size:7.5pt;line-height:1.35;margin:0;opacity:.82;max-width:100%}
h2{margin:0 0 2mm;font:600 12pt/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.body{font-size:7.4pt;line-height:1.38;color:#3b332b;text-wrap:pretty}
.body p{margin:0 0 1.6mm}
.sparkle{color:var(--wine);font-size:11pt;margin-bottom:3mm}
.meta{margin:2.5mm 0 0;font-size:7pt;line-height:1.35;color:var(--muted)}
.meta dt{font-size:5.8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--wine);margin-top:1.6mm}
.meta dd{margin:0.4mm 0 0;color:var(--ink)}
.rec{margin-top:auto;padding-top:2.5mm;border-top:0.2mm solid rgba(33,27,24,.18);font-size:7pt;line-height:1.35;color:var(--wine)}
.rec b{display:block;font-size:5.8pt;letter-spacing:.1em;text-transform:uppercase;margin-bottom:0.6mm}
.mark{position:absolute;background:var(--ink)}
@page{size:var(--pw) var(--ph);margin:0}
@media print{html,body{background:#fff}.page{margin:0}}
</style></head><body><main id="pages"></main>
<script>
const DATA = [["Варенье", "Есть особое удовольствие — достать банку летнего варенья.\n\nОткрываешь — и на секунду возвращается июль: горячий полдень, липкие от сока пальцы, дачная кухня на улице.\n\nПотом появляется запах. Не громкий, а чуть слышимый, как воспоминание, которое и не ждало повода.\n\nЛожка входит в тёмную густоту медленно, напоминая, что всё было по-настоящему, и обещая, что точно будет ещё.", "Игорь Северянин — «Рябиновая поэза»"], ["В глубине памяти", "У каждого внутреннего моря есть свои глубинные слои.\n\nНа поверхности — сегодняшние заботы. Чуть ниже — планы на завтра.\n\nНо если погрузиться дальше, туда, где почти нет движения, можно найти то, что мы не доставали годами: ощущения, почти забытые мелодии, запахи, сцену из фильма.\n\nВсё это лежит на дне и не требует подъёма. Ему не нужно быть проанализированным, исправленным или даже понятым. Достаточно просто знать: там, в глубинах памяти, живёт то, что сделало нас нами.\n\nЗакройте глаза и попробуйте вытянуть из глубины одно забытое ощущение.", "Сергей Рахманинов — Прелюдия соль минор, соч. 23 №5"], ["Встречи в пути", "И в наших ежедневных одиссеях есть остановки, которых не было в плане. Не циклопы и не бури, а события или голоса вокруг нас, которые меняют курс, а может возвращают нас на дорогу уже другими.\n\nИногда это голос-предупреждение, как у Цирцеи: «Не ходи туда, там ты потеряешь время». И мы обходим стороной целый квартал или отменяем встречу, которую так долго ждали.\n\nИногда — голос Калипсо, который задерживает нас. А бывают события-наваждения, как встречи с Сиренами. И нам предстоит решать, довериться им или отстраниться.\n\nВспомните одну случайную встречу или фразу, которая когда-то изменила ваш путь.", "Penguin Cafe Orchestra — «Perpetuum Mobile»"], ["Своя сцена", "Настоящий праздник не требует приглашений. Иногда он разворачивается на подоконнике, на скамейке в соседнем дворе или за кухонным столом, пока чайник закипает.\n\nМожно объявить утро торжественным открытием: выйти на балкон с первой чашкой кофе и считать это главной сценой. В обед устроить камерный концерт из любимых произведений.\n\nВечером объявить закрытие: старый фильм или просто долгая прогулка, где в конце вы сами себе аплодируете за то, что провели этот день по своим правилам.\n\nЛюбой день — идеальное время для самочинного праздника. Только своя афиша, свои удовольствия, свой ритм. Что бы вы поставили в программу первым пунктом?", "Рэй Брэдбери — «Вино из одуванчиков»"], ["Всякое", "На кухне, в коридоре, в ванной всегда найдётся этот ящик. Туда складывается то, что не выбрасывается, но и не находит места.\n\nБатарейки.\nШнур от чего-то.\nКлюч непонятно от чего.\nИнструкция к утюгу.\n\nЭтот ящик — биография быта. В нём оседает всё, что было нужно когда-то и может пригодиться когда-нибудь.\n\nЕсли изучить его внимательно, можно вспомнить, какие лекарства мы покупали зимой, из каких мест мы привозили ручки, чьи визитки храним.\n\nНайдите свой ящик со «всяким» и просто посмотрите, что там живёт.", "Steve Reich — «Music for 18 Musicians»"], ["Из чего состоит весна", "Весна приходит незаметно, но уверенно. Не спрашивает, не стучится. Просто становится частью комнаты, запахом мокрой листвы, светом, который не спешит уходить.\n\nИз чего же состоит весна: открытых окон, ощущения по-настоящему тёплого ветра на лице, жёлтой пыльцы на подоконнике, бесконечных закатов, первой грозы, метели из лепестков яблонь, момента, когда перестаёшь вечерами зажигать свет, тяжёлых прохладных гроздьев сирени, в которые хочется зарываться лицом.\n\nМысленно составьте список своих майских примет.", "Михаил Зенкевич — «В мае»"], ["Поднимите голову", "Небо — самый большой экран, на который не часто смотрят просто так. Над нами целый мир: плывут облака, птица выбирает направление, след самолёта тает, не дождавшись зрителей. Всё это происходит прямо сейчас.\n\nВыйдя на улицу, остановитесь на минуту и поднимите взгляд выше крыш. Что там? Не ищите ничего конкретного. Просто смотрите.\n\nНаверху всё живёт в другом ритме, попробуйте почувствовать его.", "Антуан де Сент-Экзюпери — «Планета людей»"], ["Ода монохромности", "Зимний свет приглушён, как акварель, размытая водой. Вместо ярких красок он предлагает нам сотни припылённых оттенков. В такую пору мы ищем тепло в окружающих нас фактурах, памяти предметов и собственных ощущениях.\n\nВыберите в своём окружении предмет самого «тихого», сдержанного оттенка. Рассмотрите его. Закройте глаза и попробуйте удержать этот цвет в памяти.\n\nВозвращайтесь к нему взглядом или мысленно, чтобы замедлиться.", "«Небо над Берлином»"], ["Три дара", "Чудесам не нужно просить разрешения. Когда ёлка уже убрана, а коробки с игрушками отправились обратно на антресоли, моменты волшебства не заканчиваются. В эти минуты можно начать творить их самим.\n\nВремя — подарите кому-то 10 минут вашего безраздельного внимания.\n\nСлово — напишите короткое послание себе или другому и спрячьте в карман или сумку, как будущую «случайную находку».\n\nЖест — совершите один простой бескорыстный жест: уступка, улыбка, помощь.", "Agnes Obel — Familiar"], ["На кончиках пальцев", "Иногда день возвращается не мыслью, а прикосновением. Тёплая чашка, которую держишь обеими руками. Шероховатость деревянного стола под ладонью. Край рукава, который скользит по запястью. Волосы у виска, отведённые рукой. Кожа, почувствовавшая воздух из открытого окна — прохладный, чуть влажный, с запахом мокрой листвы. Тело помнит то, чего не успела запомнить голова. Всё это остаётся на подушечках пальцев — тихо, без слов, как след от прикосновения, который держится дольше, чем кажется.", "Дэвид Линден — «Осязание»"], ["Ничего", "Есть дни, в которых ничего не происходит. И, может быть, именно поэтому в них наконец появляется место для себя. Солнечный квадрат медленно ползёт по полу. Тело становится тяжёлым, а мысли — лёгкими. Минута растягивается на полчаса, час пролетает как вздох. Лень разрешает отпустить все заботы и быть частью медленного дня. Не читать, не отвечать, не успевать. И тогда «ничего» становится главным событием дня.", "Бертран Рассел — «Похвала праздности»"], ["Долгие вечера", "На столе остывает чай. Рядом лежит книга, раскрытая на одной и той же странице. В колонке звучит музыка — тихая, почти случайная. Можно говорить. Можно молчать. Можно перечитать одну страницу и обнаружить, что прошло двадцать минут. Такие вечера не требуют, чтобы их чем-то заполнили.", "Tara Clerkin Trio — «In Spring»"]];
const KIND = "state";
const TW = 148, TH = 105;
const re = /\s+(в|во|и|а|но|к|ко|с|со|у|о|об|от|до|из|на|по|за|для|без|над|под|при|про|не|что|как|же)\s+/gi;
const t = s => String(s == null ? '' : s).replace(re, ' $1\u00A0');
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const pages = document.getElementById('pages');
function marks(){
  const m = el('div','marks');
  const pos = [[8,8,'h'],[8,8,'v'],[8+TW,8,'h'],[8+TW,8,'v'],[8,8+TH,'h'],[8,8+TH,'v'],[8+TW,8+TH,'h'],[8+TW,8+TH,'v']];
  pos.forEach(([x,y,dir])=>{
    const line = el('div','mark');
    if(dir==='h'){ line.style.cssText += `left:${x-4}mm;top:${y}mm;width:4mm;height:0.2mm`; }
    else { line.style.cssText += `left:${x}mm;top:${y-4}mm;width:0.2mm;height:4mm`; }
    m.appendChild(line);
  });
  return m;
}
DATA.forEach((c) => {
  const front = el('section','page front');
  const trimF = el('div','trim');
  const safeF = el('div','safe');
  if (KIND === 'state') {
    safeF.appendChild(el('div','cat','зима · открытка'));
    safeF.appendChild(el('h1', null, t(c[0])));
    safeF.appendChild(el('p','mood', ''));
  } else {
    safeF.appendChild(el('div','cat', t(c[1])));
    safeF.appendChild(el('h1', null, t(c[0])));
    safeF.appendChild(el('p','mood', t(c[7])));
  }
  trimF.appendChild(safeF); front.appendChild(trimF); front.appendChild(marks()); pages.appendChild(front);

  const back = el('section','page back');
  const trimB = el('div','trim');
  const safeB = el('div','safe');
  safeB.appendChild(el('div','sparkle','✦'));
  safeB.appendChild(el('h2', null, t(c[0])));
  if (KIND === 'state') {
    const body = el('div','body');
    String(c[1]).split(/\n+/).filter(Boolean).forEach(p => body.appendChild(el('p', null, t(p))));
    safeB.appendChild(body);
    safeB.appendChild(el('div','rec', `<b>Рекомендация</b>${t(c[2])}`));
  } else {
    const meta = el('dl','meta');
    const rows = [['Куда', c[2]], ['Остановки', c[5]], ['Ритм', c[3]]];
    rows.forEach(([k,v]) => { if(v){ meta.appendChild(el('dt', null, k)); meta.appendChild(el('dd', null, t(v))); } });
    safeB.appendChild(meta);
    safeB.appendChild(el('div','rec', `<b>Саундтрек</b>${t(c[6])}`));
  }
  trimB.appendChild(safeB); back.appendChild(trimB); back.appendChild(marks()); pages.appendChild(back);
});
</script></body></html>
