    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,sans-serif}main{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,72px) clamp(18px,4vw,52px) 70px}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.item{background:var(--surface);border:1px solid var(--line);position:relative;transition:transform .2s,box-shadow .2s}.item:hover{transform:translateY(-3px);box-shadow:0 10px 24px #20231f12}.item.bought{border-color:#9db7a4}.photo{display:block;width:100%;height:290px;object-fit:contain;background:#e9ebe3}.body{padding:16px}.brand{font-size:13px;color:var(--muted);margin:0 0 3px}.name{font-weight:700;margin:0 0 10px}.price{font-weight:700;color:var(--accent);margin:0 0 14px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tag{background:#edf0e8;color:#4d554b;padding:4px 7px;font-size:12px}.purchase{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--ok);cursor:pointer}.purchase input{width:20px;height:20px;accent-color:var(--ok)}.link{display:block;margin-top:14px;color:var(--accent);font-size:14px;font-weight:700}.empty{display:none;padding:40px 0;color:var(--muted)}
    @media(max-width:700px){.top{display:block;margin-bottom:34px}.intro{margin-top:20px}.count{width:100%;margin-left:0}.photo{height:230px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:12px}.name{font-size:14px}.price{font-size:14px}.link{font-size:12px}}
    @media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:280px}}
    @media(prefers-reduced-motion:reduce){.item{transition:none}}
  </style>
</head>

const key='natasha-wardrobe-current';
let memoryBought=[];
const storage={get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return memoryBought}},set(value){memoryBought=value;try{localStorage.setItem(key,JSON.stringify(value))}catch{}}};
let bought=storage.get();
if(!Array.isArray(bought)) bought=[];
const catalog=document.querySelector('#catalog');const count=document.querySelector('#count');
function draw(){const season=document.querySelector('#season').value,category=document.querySelector('#category').value,only=document.querySelector('#boughtOnly').checked;catalog.innerHTML='';let visible=0;items.forEach((x,i)=>{if((season!=='all'&&x[3]!==season)||(category!=='all'&&x[2]!==category)||(only&&!bought.includes(i)))return;visible++;const article=document.createElement('article');article.className='item '+(bought.includes(i)?'bought':'');article.innerHTML=`<a href="${x[7]}" target="_blank" rel="noreferrer"><img class="photo" src="${x[6]}" alt="${x[0]} — ${x[1]}" loading="lazy"></a><div class="body"><p class="brand">${x[0]}</p><p class="name">${x[1]}</p><p class="price">${x[4]} ₽</p><div class="meta"><span class="tag">${x[2]}</span><span class="tag">${x[3]}</span></div><label class="purchase"><input type="checkbox" ${bought.includes(i)?'checked':''} data-index="${i}"> Есть сейчас</label><a class="link" href="${x[7]}" target="_blank" rel="noreferrer">Открыть на Lamoda →</a></div>`;catalog.append(article)});count.textContent=`${visible} из ${items.length} вещей`;document.querySelector('#empty').style.display=visible?'none':'block';catalog.querySelectorAll('input').forEach(input=>input.onchange=()=>{const i=+input.dataset.index;bought=input.checked?[...new Set([...bought,i])]:bought.filter(n=>n!==i);storage.set(bought);draw()})}
document.querySelector('#export').onclick=()=>{const data=items.map((x,i)=>({brand:x[0],name:x[1],category:x[2],season:x[3],price:x[4]+' ₽',photo:x[6],url:x[7],current:bought.includes(i)}));const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wardrobe-for-stylist.json';a.click()};
document.querySelectorAll('select,#boughtOnly').forEach(el=>el.onchange=draw);document.querySelector('#clear').onclick=()=>{bought=[];storage.set(bought);draw()};draw();
</script>
